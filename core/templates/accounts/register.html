{% extends 'base.html' %}

{% block title %}Perfil del empleado{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title mb-4">Perfil del empleado</h2>
                <p><strong>Usuario:</strong> {{ request.user.username }}</p>
                <p><strong>Correo:</strong> {{ request.user.email|default:'No disponible' }}</p>
                <p><strong>Nombre:</strong> Andre</p>
                <div class="mt-4">
                    <a href="{% url 'dashboard' %}" class="btn btn-primary">Ir al dashboard</a>
                    <a href="{% url 'logout' %}" class="btn btn-outline-secondary">Salir</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
