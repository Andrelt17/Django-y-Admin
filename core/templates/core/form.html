<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalación exitosa de Django</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 860px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 40px 80px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            padding: 56px;
            align-items: center;
        }
        .hero-text h1 {
            margin: 0;
            font-size: clamp(2.25rem, 4vw, 3.5rem);
            line-height: 1.05;
        }
        .hero-text p {
            margin: 24px 0 0;
            max-width: 520px;
            line-height: 1.7;
            color: #334155;
        }
        .hero-text a {
            color: #0f172a;
            text-decoration: none;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 2px;
        }
        .hero-text a:hover {
            border-color: #94a3b8;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            padding: 12px 16px;
            background: #eef2ff;
            border-radius: 999px;
            font-weight: 600;
            color: #4338ca;
            font-size: 0.95rem;
        }
        .badge svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .illustration {
            display: flex;
            justify-content: center;
        }
        .rocket {
            position: relative;
            width: 280px;
            height: 300px;
            background: linear-gradient(180deg, #fffbfe 0%, #eef2ff 100%);
            border-radius: 48% 52% 52% 48% / 55% 55% 45% 45%;
            box-shadow: inset 0 18px 50px rgba(99, 102, 241, 0.14);
        }
        .rocket::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 16px;
            transform: translateX(-50%);
            width: 70px;
            height: 100px;
            background: #eef2ff;
            border-radius: 50% 50% 48% 48%;
        }
        .rocket::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            width: 34px;
            height: 34px;
            background: #c7d2fe;
            border-radius: 50%;
        }
        .rocket-inner {
            position: absolute;
            left: 50%;
            top: 34px;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            background: #6366f1;
            border-radius: 50%;
        }
        .footer {
            padding: 28px 56px 48px;
            background: #f8fafc;
            color: #475569;
            border-top: 1px solid #e2e8f0;
            font-size: 0.98rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <div class="hero-text">
                <div class="badge">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2Zm4.002 11.296-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L11 14.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"></path></svg>
                    Instalación correcta
                </div>
                <h1>The install worked successfully! Congratulations!</h1>
                <p>You are seeing this page because <strong>DEBUG=True</strong> is in your settings file and you have not configured any URLs.</p>
                <p><a href="https://docs.djangoproject.com/en/5.2/releases/" target="_blank" rel="noreferrer">View release notes for Django 5.2</a></p>
            </div>
            <div class="illustration">
                <div class="rocket">
                    <div class="rocket-inner"></div>
                </div>
            </div>
        </div>
        <div class="footer">
            <p>Este es el contenido que solicitaste en lugar del formulario.</p>
        </div>
    </div>
</body>
</html>
