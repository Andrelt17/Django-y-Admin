{% extends 'base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="login-page d-flex align-items-center justify-content-center py-5">
    <div class="login-card shadow-sm overflow-hidden">
        <div class="login-card-header text-center text-white py-5 px-4">
            <div class="login-logo mb-3">E</div>
            <h2 class="h4 mb-1">Sistema de Envíos</h2>
            <p class="small opacity-85 mb-0">Accede a tu panel administrativo</p>
        </div>
        <div class="card-body p-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post" class="login-form">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Usuario</label>
                    <input type="text" name="username" autofocus required id="id_username" class="form-control" placeholder="Nombre de usuario">
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Contraseña</label>
                    <input type="password" name="password" required id="id_password" class="form-control" placeholder="Contraseña">
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
